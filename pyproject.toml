[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopshield"
version = "1.0.0"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
description = "A lightweight, vendor-agnostic AI agent loop detection and self-healing middleware"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0", "langgraph>=0.1.0"]
langgraph = ["langgraph>=0.1.0"]
crewai = ["crewai>=0.1.0"]

# Modern PEP-compliant self-referential 'all' extra grouping
all = [
    "loopshield[langchain,langgraph,crewai]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loopshield*"]
